      function mapWeatherCode(code) {
        if (code === 0) {
          return {label: '맑음', emoji: '☀️'};
        }
        if (code === 1 || code === 2) {
          return {label: '구름 조금', emoji: '⛅'};
        }
        if (code === 3) {
          return {label: '흐림', emoji: '☁️'};
        }
        if (code === 45 || code === 48) {
          return {label: '안개', emoji: '🌫️'};
        }
        if (code === 51 || code === 53 || code === 55 || code === 56 || code === 57) {
          return {label: '이슬비', emoji: '🌦️'};
        }
        if (
          code === 61 ||
          code === 63 ||
          code === 65 ||
          code === 66 ||
          code === 67 ||
          code === 80 ||
          code === 81 ||
          code === 82
        ) {
          return {label: '비', emoji: '🌧️'};
        }
        if (
          code === 71 ||
          code === 73 ||
          code === 75 ||
          code === 77 ||
          code === 85 ||
          code === 86
        ) {
          return {label: '눈', emoji: '❄️'};
        }
        if (code === 95 || code === 96 || code === 99) {
          return {label: '천둥·번개', emoji: '⛈️'};
        }
        return {label: '흐림', emoji: '☁️'};
      }

      async function fetchOpenMeteoWeather(lat, lon, signal) {
        const url = new URL('https://api.open-meteo.com/v1/forecast');
        url.searchParams.set('latitude', lat.toFixed(4));
        url.searchParams.set('longitude', lon.toFixed(4));
        url.searchParams.set('current', 'temperature_2m,apparent_temperature,weather_code');
        url.searchParams.set(
          'daily',
          'temperature_2m_max,temperature_2m_min,precipitation_probability_max',
        );
        url.searchParams.set('timezone', 'Asia/Seoul');
        url.searchParams.set('forecast_days', '1');

        const response = await fetch(url.toString(), {signal});
        if (!response.ok) {
          throw new Error('날씨 정보를 불러오지 못했어요.');
        }

        const data = await response.json();
        const current = data && data.current;
        const daily = data && data.daily;

        if (!current || !daily) {
          throw new Error('날씨 데이터 형식이 올바르지 않아요.');
        }

        const {label, emoji} = mapWeatherCode(Number(current.weather_code ?? 3));

        return {
          temperature: Math.round(Number(current.temperature_2m ?? 0)),
          apparentTemperature: Math.round(Number(current.apparent_temperature ?? 0)),
          weatherLabel: label,
          weatherEmoji: emoji,
          tempMin: Math.round(Number((daily.temperature_2m_min && daily.temperature_2m_min[0]) ?? 0)),
          tempMax: Math.round(Number((daily.temperature_2m_max && daily.temperature_2m_max[0]) ?? 0)),
          precipitationProbability: Math.round(
            Number((daily.precipitation_probability_max && daily.precipitation_probability_max[0]) ?? 0),
          ),
        };
      }

        } else if (feelsLike <= 22) {
          reason = `기온이 ${weather.temperature}℃로 활동하기 쾌적하지만 바람이 불 때를 대비해 얇은 겉옷을 곁들이시면 좋아요.`;
        } else {
          reason = `체감온도가 ${feelsLike}℃로 따뜻하고 더운 편이니 통풍이 잘되는 가벼운 소재로 시원하게 입으시는 것을 추천해요.`;
        }

        return {
          outer: chosen.outer,
          top: chosen.top,
          bottom: chosen.bottom,
          shoes: chosen.shoes,
          accessory: chosen.accessory,
          reason,
        };
      }

      // =========================================================================
      // WeatherScreen (src/components/WeatherScreen.tsx)
      // =========================================================================
      function WeatherScreen({onBack, onProceedToRecommend}) {
        const [geoStatus, setGeoStatus] = useState('idle');
        const [selectedCity, setSelectedCity] = useState(null);
        const [selectedSeoulDistrict, setSelectedSeoulDistrict] = useState(null);
        const [dongSearch, setDongSearch] = useState('');
        const [activeLocation, setActiveLocation] = useState(null);

        const [weather, setWeather] = useState(null);
        const [isLoadingWeather, setIsLoadingWeather] = useState(false);
        const [weatherError, setWeatherError] = useState(null);
        const [nudgeLocation, setNudgeLocation] = useState(false);

        const locationHeadingRef = useRef(null);
        const weatherCardRef = useRef(null);
        const abortRef = useRef(null);

        const loadWeatherForCoords = useCallback(async (lat, lon) => {
          if (abortRef.current) {
            abortRef.current.abort();
          }
          const controller = new AbortController();
          abortRef.current = controller;

          setIsLoadingWeather(true);
          setWeatherError(null);

          try {
            const result = await fetchOpenMeteoWeather(lat, lon, controller.signal);
            if (!controller.signal.aborted) {
              setWeather(result);
            }
          } catch (err) {
            if (err instanceof DOMException && err.name === 'AbortError') {
              return;
            }
            if (!controller.signal.aborted) {
              setWeather(null);
              setWeatherError('날씨를 불러오지 못했어요. 다시 시도해 주세요.');
            }
          } finally {
            if (!controller.signal.aborted) {
              setIsLoadingWeather(false);
            }
          }
        }, []);

        const requestCurrentLocation = useCallback(() => {
          if (typeof navigator === 'undefined' || !navigator.geolocation) {
            setGeoStatus('failed');
            return;
          }

          setGeoStatus('checking');

          navigator.geolocation.getCurrentPosition(
            (position) => {
              const {latitude, longitude} = position.coords;
              setGeoStatus('granted');
              setSelectedCity(null);
              setSelectedSeoulDistrict(null);
              setDongSearch('');
              setActiveLocation({
                label: '현재 위치',
                lat: latitude,
                lon: longitude,
              });
              void loadWeatherForCoords(latitude, longitude);
            },
            () => {
              setGeoStatus('failed');
            },
            {
              enableHighAccuracy: false,
              timeout: 6000,
              maximumAge: 0,
            },
          );
        }, [loadWeatherForCoords]);

        useEffect(() => {
          requestCurrentLocation();
          return () => {
            if (abortRef.current) {
              abortRef.current.abort();
            }
          };
        }, [requestCurrentLocation]);

        const handleSelectCity = (cityId) => {
          setSelectedCity(cityId);
          setSelectedSeoulDistrict(null);
          setDongSearch('');
        };

        const handleSelectSubRegion = (cityName, subRegion) => {
          const fullLabel = subRegion.district
            ? `${cityName} ${subRegion.district} ${subRegion.name}`
            : `${cityName} ${subRegion.name}`;

          setActiveLocation({
            label: fullLabel,
            lat: subRegion.lat,
            lon: subRegion.lon,
            subRegionId: subRegion.id,
          });
          void loadWeatherForCoords(subRegion.lat, subRegion.lon);

          requestAnimationFrame(() => {
            if (weatherCardRef.current) {
              weatherCardRef.current.scrollIntoView({
                behavior: 'smooth',
                block: 'nearest',
              });
            }
          });
        };

        const filteredSeoulDongs = useMemo(() => {
          const keyword = dongSearch.trim();
          if (keyword.length > 0) {
            return SEOUL_DONGS.filter(
              (dong) =>
                dong.name.includes(keyword) ||
                (dong.district && dong.district.includes(keyword)),
            );
          }
          if (selectedSeoulDistrict) {
            return SEOUL_DONGS.filter((dong) => dong.district === selectedSeoulDistrict);
          }
          return [];
        }, [dongSearch, selectedSeoulDistrict]);

        const selectedCityInfo = useMemo(
          () => CITIES.find((c) => c.id === selectedCity) ?? null,
          [selectedCity],
        );

        const locationMessage =
          geoStatus === 'failed'
            ? '위치를 찾지 못했어요. 지역을 골라 주세요'
            : '지역을 골라 주세요';

        const handleRecommendClick = () => {
          if (!activeLocation || !weather || isLoadingWeather) {
            setNudgeLocation(false);
            requestAnimationFrame(() => {
              setNudgeLocation(true);
            });
            if (locationHeadingRef.current) {
              locationHeadingRef.current.scrollIntoView({
                behavior: 'smooth',
                block: 'center',
              });
            }
            return;
          }
          onProceedToRecommend(activeLocation.label, weather);
        };

        return (
          <div className="min-h-screen bg-gradient-to-b from-sky-100/80 via-[#F4FAFF] to-[#FFFFFF] text-[#0F2942] flex flex-col">
            {/* Top Header */}
            <header className="w-full border-b border-sky-200/70 bg-white/80 backdrop-blur-sm">
              <div className="max-w-3xl mx-auto px-5 sm:px-8 py-4 flex items-center justify-between">
                <span className="text-xl sm:text-2xl font-bold tracking-tight text-sky-700 whitespace-nowrap shrink-0">
                  오늘 착장
                </span>
                <span className="text-sm sm:text-base font-medium text-sky-700/80 whitespace-nowrap shrink-0">
                  오늘 날씨
                </span>
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-1 w-full max-w-3xl mx-auto px-5 sm:px-8 pt-6 pb-10 sm:pt-9 sm:pb-12">
              {/* Intro Heading */}
              <div className="mb-7 sm:mb-8">
                <h1 className="text-[28px] sm:text-[34px] font-bold tracking-tight text-[#0F2942] leading-tight text-balance">
                  오늘 날씨
                </h1>
                <p className="mt-2 text-base sm:text-lg text-slate-600 leading-relaxed">
                  지금 계신 곳의 날씨를 확인한 뒤 옷차림을 알아보세요.
                </p>
              </div>

              {/* Weather Summary Card (Loading / Loaded / Error) */}
              {(isLoadingWeather || weather || weatherError) && (
                <section
                  ref={weatherCardRef}
                  aria-live="polite"
                  className="mb-8 rounded-3xl border-2 border-sky-300 bg-white p-5 sm:p-7 shadow-md shadow-sky-200/50"
                >
                  {isLoadingWeather ? (
                    <div className="flex items-center justify-center gap-3 py-5 text-sky-700">
                      <Loader2 className="w-6 h-6 animate-spin shrink-0" aria-hidden="true" />
                      <span className="text-xl sm:text-2xl font-bold">
                        날씨를 확인하는 중…
                      </span>
                    </div>
                  ) : weatherError ? (
                    <div className="text-center py-3">
                      <p className="text-lg font-semibold text-[#0F2942]">{weatherError}</p>
                      {activeLocation && (
                        <button
                          type="button"
                          onClick={() =>
                            void loadWeatherForCoords(activeLocation.lat, activeLocation.lon)
                          }
                          className="mt-4 min-h-[48px] px-6 py-2.5 rounded-2xl bg-sky-600 hover:bg-sky-700 text-white text-base font-bold transition-colors cursor-pointer"
                        >
                          다시 확인하기
                        </button>
                      )}
                    </div>
                  ) : weather ? (
                    <div>
                      {activeLocation && (
                        <div className="flex items-center gap-1.5 text-base sm:text-lg font-semibold text-sky-700 mb-3">
                          <MapPin className="w-5 h-5 shrink-0" aria-hidden="true" />

                      <p className="text-2xl sm:text-[28px] font-bold text-[#0F2942] leading-snug tabular-nums">
                        {weather.weatherEmoji} 지금 {weather.temperature}℃ (체감{' '}
                        {weather.apparentTemperature}℃) · {weather.weatherLabel}
                      </p>

                      <p className="mt-3 text-lg sm:text-xl font-semibold text-slate-700 leading-relaxed tabular-nums">
                        오늘 최저 {weather.tempMin}℃ · 최고 {weather.tempMax}℃ · 비 올 확률{' '}
                        {weather.precipitationProbability}%
                      </p>
                    </div>
                  ) : null}
                </section>
              )}

              {/* Location Selection Section */}
              <section ref={locationHeadingRef} aria-labelledby="location-heading">
                <div className="flex flex-wrap items-center justify-between gap-3 mb-4">

                        nudgeLocation ? 'animate-nudge text-sky-700' : ''

                    {geoStatus === 'checking' && (

                        <span>현재 위치를 찾는 중이에요… 아래에서 바로 고르실 수도 있어요.</span>
                      </p>

                  </div>

                  <button

                    isLoading

                    isLoading

      // =========================================================================
      // App (src/App.tsx)
      // =========================================================================
      const AGE_OPTIONS = ['20대', '30대', '40대', '50대', '60대', '70대 이상'];
      const GENDER_OPTIONS = ['여성', '남성', '선택 안 함'];

      const STYLE_OPTIONS = [
        {
          id: 'casual',
          name: '편안한 캐주얼',
          description: '동네 산책·장보기, 편하고 무난하게',
          renderIllustration: (selected) => <CasualIllustration selected={selected} />,
        },
        {
          id: 'neat',
          name: '단정한 외출복',
          description: '모임·병원·관공서, 깔끔하게',
          renderIllustration: (selected) => <NeatIllustration selected={selected} />,
        },
        {
          id: 'active',
          name: '활동적인 운동복',
          description: '걷기·등산·운동, 가볍고 따뜻하게',
          renderIllustration: (selected) => <ActiveIllustration selected={selected} />,
        },
        {
          id: 'classic',
          name: '차분한 클래식',
          description: '격식 있는 자리, 고급스럽게',
          renderIllustration: (selected) => <ClassicIllustration selected={selected} />,
        },
      ];

      function getObjectParticle(label) {
        if (label === '연령대') {
          return '를';
        }
        return '을';
      }

      function formatMissingMessage(missingLabels) {
        if (missingLabels.length === 0) {
          return '';
        }
        const lastLabel = missingLabels[missingLabels.length - 1];
        const particle = getObjectParticle(lastLabel);
        return `${missingLabels.join(', ')}${particle} 골라 주세요`;
      }

      function App() {
        const [selectedAge, setSelectedAge] = useState(null);
        const [selectedGender, setSelectedGender] = useState(null);
        const [selectedStyle, setSelectedStyle] = useState(null);
        const [nudgeActive, setNudgeActive] = useState(false);
        const [currentStep, setCurrentStep] = useState('about');

        const [weatherContext, setWeatherContext] = useState(null);
        const [recommendation, setRecommendation] = useState(null);
        const [isRecommending, setIsRecommending] = useState(false);
        const [recommendError, setRecommendError] = useState(false);

        const isRecommendingRef = useRef(false);
        const recommendCountRef = useRef(0);
        const ageSectionRef = useRef(null);
        const genderSectionRef = useRef(null);
        const styleSectionRef = useRef(null);

        const missingItems = [];
        if (!selectedAge) {
          missingItems.push({label: '연령대', ref: ageSectionRef});
        }
        if (!selectedGender) {
          missingItems.push({label: '성별', ref: genderSectionRef});
        }
        if (!selectedStyle) {
          missingItems.push({label: '선호하는 옷 스타일', ref: styleSectionRef});
        }

        const isComplete = missingItems.length === 0;
        const missingMessage = formatMissingMessage(missingItems.map((item) => item.label));

        const handleDisabledNextAttempt = () => {
          if (isComplete) {
            return;
          }
          setNudgeActive(false);
          requestAnimationFrame(() => {
            setNudgeActive(true);
          });
          const firstMissing = missingItems[0];
          if (firstMissing && firstMissing.ref.current) {
            firstMissing.ref.current.scrollIntoView({
              behavior: 'smooth',
              block: 'center',
            });
          }
        };

        const handleNextClick = () => {
          if (!isComplete) {
            handleDisabledNextAttempt();
            return;
          }
          setCurrentStep('weather');
          window.scrollTo({top: 0, behavior: 'auto'});
        };

        const handleBackToAbout = () => {
          setCurrentStep('about');
          window.scrollTo({top: 0, behavior: 'auto'});
        };

        const requestRecommendationOnce = async (locationLabel, weather) => {
          if (isRecommendingRef.current || !selectedAge || !selectedGender || !selectedStyle) {
            return;
          }
          const styleDetail = STYLE_OPTIONS.find((item) => item.id === selectedStyle);
          if (!styleDetail) {
            return;
          }

          isRecommendingRef.current = true;
          setIsRecommending(true);
          setRecommendError(false);
          setRecommendation(null);

          const variantIdx = recommendCountRef.current;
          recommendCountRef.current += 1;

          try {
            let apiRecommendation = null;
            const canTryServerApi =
              window.location.protocol !== 'file:' &&
              !window.location.hostname.endsWith('github.io');

            if (canTryServerApi) {
              try {
                const response = await fetch('/api/recommend-outfit', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({
                    age: selectedAge,
                    gender: selectedGender,
                    styleName: styleDetail.name,
                    styleDescription: styleDetail.description,
                    temperature: weather.temperature,
                    apparentTemperature: weather.apparentTemperature,
                    weatherLabel: weather.weatherLabel,
                    tempMin: weather.tempMin,
                    tempMax: weather.tempMax,
                    precipitationProbability: weather.precipitationProbability,
                  }),
                });

                if (response.ok) {
                  const data = await response.json();
                  if (data && data.recommendation) {
                    apiRecommendation = data.recommendation;
                  }
                }
              } catch {
                // Backend not available on static hosting; fall back cleanly below.
              }
            }

            if (apiRecommendation) {
              setRecommendation(apiRecommendation);
            } else {
              await new Promise((resolve) => setTimeout(resolve, 450));
              const localRecommendation = buildLocalOutfitRecommendation({
                age: selectedAge,
                gender: selectedGender,
                styleId: selectedStyle,
                weather,
                variantIndex: variantIdx,
              });
              setRecommendation(localRecommendation);
            }
          } catch {
            setRecommendError(true);
          } finally {
            isRecommendingRef.current = false;
            setIsRecommending(false);
          }
        };

        const handleProceedToRecommend = (locationLabel, weather) => {
          setWeatherContext({locationLabel, weather});
          setCurrentStep('recommend');
          window.scrollTo({top: 0, behavior: 'auto'});
          void requestRecommendationOnce(locationLabel, weather);
        };

        const handleRetryRecommend = () => {
          if (!weatherContext) {
            return;
          }
          void requestRecommendationOnce(
            weatherContext.locationLabel,
            weatherContext.weather,
          );
        };

        const handleStartOver = () => {
          if (isRecommendingRef.current) {
            return;
          }
          setSelectedAge(null);
          setSelectedGender(null);
          setSelectedStyle(null);
          setWeatherContext(null);
          setRecommendation(null);
          setRecommendError(false);
          recommendCountRef.current = 0;
          setCurrentStep('about');
          window.scrollTo({top: 0, behavior: 'auto'});
        };

        if (currentStep === 'weather') {
          return (
            <WeatherScreen
              onBack={handleBackToAbout}
              onProceedToRecommend={handleProceedToRecommend}
            />
          );
        }

        if (currentStep === 'recommend' && weatherContext && selectedStyle) {
          const styleDetail = STYLE_OPTIONS.find((item) => item.id === selectedStyle);
          if (styleDetail) {
            return (
              <RecommendationScreen
                styleName={styleDetail.name}
                styleDescription={styleDetail.description}
                styleIllustration={styleDetail.renderIllustration(true)}
                locationLabel={weatherContext.locationLabel}
                weather={weatherContext.weather}
                recommendation={recommendation}
                isLoading={isRecommending}
                hasError={recommendError}
                onRetryRecommend={handleRetryRecommend}
                onStartOver={handleStartOver}
              />
            );
          }
        }

        return (
          <div className="min-h-screen bg-gradient-to-b from-sky-100/80 via-[#F4FAFF] to-[#FFFFFF] text-[#0F2942] flex flex-col">
            {/* Top Header */}
            <header className="w-full border-b border-sky-200/70 bg-white/80 backdrop-blur-sm">
              <div className="max-w-3xl mx-auto px-5 sm:px-8 py-4 flex items-center justify-between">
                <span className="text-xl sm:text-2xl font-bold tracking-tight text-sky-700 whitespace-nowrap shrink-0">
                  오늘 착장
                </span>
                <span className="text-sm sm:text-base font-medium text-sky-700/80 whitespace-nowrap shrink-0">
                  나에 대해
                </span>
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-1 w-full max-w-3xl mx-auto px-5 sm:px-8 pt-6 pb-8 sm:pt-9 sm:pb-12">
              {/* Intro Heading */}
              <div className="mb-8 sm:mb-10">
                <h1 className="text-[28px] sm:text-[34px] font-bold tracking-tight text-[#0F2942] leading-tight text-balance">
                  나에 대해
                </h1>
                <p className="mt-2 text-base sm:text-lg text-slate-600 leading-relaxed">
                  편안하게 입을 수 있도록 연령대, 성별, 선호하는 스타일을 골라 주세요.
                </p>
              </div>

              <div className="space-y-9 sm:space-y-11">
                {/* 1. 연령대 */}
                <section ref={ageSectionRef} aria-labelledby="age-heading">
                  <div className="flex items-baseline justify-between gap-4 mb-4">
                    <h2
                      id="age-heading"
                      className="text-xl sm:text-2xl font-bold text-[#0F2942]"
                    >
                      연령대
                    </h2>
                    <span className="text-sm sm:text-base text-sky-700 font-medium">
                      하나만 선택
                    </span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {AGE_OPTIONS.map((age) => {
                      const isSelected = selectedAge === age;
                      return (
                        <button
                          key={age}
                          type="button"
                          aria-pressed={isSelected}
                          onClick={() => setSelectedAge(age)}
                          className={`min-h-[58px] sm:min-h-[64px] px-4 py-3 rounded-2xl text-lg sm:text-xl font-bold transition-all duration-150 flex items-center justify-center gap-2 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-sky-300 active:scale-[0.98] whitespace-nowrap cursor-pointer ${
                            isSelected
                              ? 'bg-sky-600 text-white border-[3px] border-sky-700 shadow-md shadow-sky-600/20'
                              : 'bg-white text-[#0F2942] border-2 border-sky-200 hover:border-sky-400 hover:bg-sky-50/70'
                          }`}
                        >
                          {isSelected && (
                            <Check className="w-5 h-5 shrink-0 stroke-[3]" aria-hidden="true" />
                          )}
                          <span>{age}</span>
                        </button>
                      );
                    })}
                  </div>
                </section>

                <hr className="border-sky-100" />

                {/* 2. 성별 */}
                <section ref={genderSectionRef} aria-labelledby="gender-heading">
                  <div className="flex items-baseline justify-between gap-4 mb-4">
                    <h2
                      id="gender-heading"
                      className="text-xl sm:text-2xl font-bold text-[#0F2942]"
                    >
                      성별
                    </h2>
                    <span className="text-sm sm:text-base text-sky-700 font-medium">
                      하나만 선택
                    </span>
                  </div>

                  <div className="grid grid-cols-3 gap-2.5 sm:gap-3.5">
                    {GENDER_OPTIONS.map((gender) => {
                      const isSelected = selectedGender === gender;
                      return (
                        <button
                          key={gender}
                          type="button"
                          aria-pressed={isSelected}
                          onClick={() => setSelectedGender(gender)}
                          className={`min-h-[58px] sm:min-h-[64px] px-3 sm:px-4 py-3 rounded-2xl text-base sm:text-xl font-bold transition-all duration-150 flex items-center justify-center gap-1.5 sm:gap-2 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-sky-300 active:scale-[0.98] whitespace-nowrap cursor-pointer ${
                            isSelected
                              ? 'bg-sky-600 text-white border-[3px] border-sky-700 shadow-md shadow-sky-600/20'
                              : 'bg-white text-[#0F2942] border-2 border-sky-200 hover:border-sky-400 hover:bg-sky-50/70'
                          }`}
                        >
                          {isSelected && (
                            <Check className="w-5 h-5 shrink-0 stroke-[3]" aria-hidden="true" />
                          )}
                          <span>{gender}</span>
                        </button>
                      );
                    })}
                  </div>
                </section>

                <hr className="border-sky-100" />

                {/* 3. 선호하는 옷 스타일 */}
                <section ref={styleSectionRef} aria-labelledby="style-heading">
                  <div className="flex items-baseline justify-between gap-4 mb-4">
                    <h2
                      id="style-heading"
                      className="text-xl sm:text-2xl font-bold text-[#0F2942]"
                    >
                      선호하는 옷 스타일
                    </h2>
                    <span className="text-sm sm:text-base text-sky-700 font-medium">
                      하나만 선택
                    </span>
                  </div>

                  <fieldset className="border-0 p-0 m-0">
                    <legend className="sr-only">선호하는 옷 스타일</legend>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5 sm:gap-4">
                      {STYLE_OPTIONS.map((style) => {
                        const isSelected = selectedStyle === style.id;
                        return (
                          <label
                            key={style.id}
                            className={`group relative flex items-center gap-4 p-4 sm:p-5 rounded-3xl transition-all duration-150 cursor-pointer select-none focus-within:ring-4 focus-within:ring-sky-300 active:scale-[0.99] ${
                              isSelected
                                ? 'bg-sky-50 border-[3px] border-sky-600 shadow-md shadow-sky-200/70'
                                : 'bg-white border-2 border-sky-200/90 hover:border-sky-400 hover:bg-sky-50/40'
                            }`}
                          >
                            <input
                              type="radio"
                              name="preferred-style"
                              value={style.id}
                              checked={isSelected}
                              onChange={() => setSelectedStyle(style.id)}
                              className="sr-only"
                            />

                            {/* Custom SVG Illustration */}
                            <div className="w-20 h-20 sm:w-22 sm:h-22 shrink-0">
                              {style.renderIllustration(isSelected)}
                            </div>

                            {/* Text Content */}
                            <div className="flex-1 min-w-0">
                              <div className="text-lg sm:text-xl font-bold text-[#0F2942] leading-snug">
                                {style.name}
                              </div>
                              <p className="mt-1 text-sm sm:text-base text-slate-600 leading-snug">
                                {style.description}
                              </p>
                            </div>

                            {/* Large Visual Radio Indicator */}
                            <div
                              aria-hidden="true"
                              className={`w-7 h-7 sm:w-8 sm:h-8 rounded-full shrink-0 flex items-center justify-center transition-colors ${
                                isSelected
                                  ? 'border-[3px] border-sky-600 bg-white'
                                  : 'border-2 border-slate-300 bg-white group-hover:border-sky-400'
                              }`}
                            >
                              {isSelected && (
                                <span className="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-sky-600" />
                              )}
                            </div>
                          </label>
                        );
                      })}
                    </div>
                  </fieldset>
                </section>
              </div>
            </main>

            {/* Bottom Action Area */}
            <footer className="sticky bottom-0 z-20 w-full bg-gradient-to-t from-[#F4FAFF] via-[#F4FAFF]/95 to-transparent pt-3 pb-4 px-5 sm:px-8 border-t border-sky-100/80">
              <div className="max-w-3xl mx-auto">
                {/* Missing field prompt */}
                {!isComplete && (
                  <p
                    role="status"
                    aria-live="polite"
                    onAnimationEnd={() => setNudgeActive(false)}
                    className={`mb-2.5 text-center text-base sm:text-lg font-semibold text-sky-800 ${
                      nudgeActive ? 'animate-nudge' : ''
                    }`}
                  >
                    {missingMessage}
                  </p>
                )}

                {/* Disabled tap catcher wrapper so tapping the disabled area guides the user */}
                <div
                  onClick={() => {
                    if (!isComplete) {
                      handleDisabledNextAttempt();
                    }
                  }}
                  className="w-full"
                >
                  <button
                    type="button"
                    disabled={!isComplete}
                    aria-disabled={!isComplete}
                    onClick={handleNextClick}
                    className={`w-full min-h-[56px] sm:min-h-[60px] rounded-2xl text-lg sm:text-xl font-bold flex items-center justify-center gap-2 transition-all duration-150 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-sky-300 ${
                      isComplete
                        ? 'bg-sky-600 hover:bg-sky-700 text-white shadow-lg shadow-sky-600/25 active:scale-[0.99] cursor-pointer'
                        : 'bg-slate-200 text-slate-500 cursor-not-allowed pointer-events-none'
                    }`}
                  >
                    <span>다음</span>
                    <ChevronRight className="w-6 h-6 shrink-0" aria-hidden="true" />
                  </button>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
